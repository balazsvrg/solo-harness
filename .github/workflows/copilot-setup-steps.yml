# Environment for the Copilot cloud agent (R7). Copilot runs the one job
# `copilot-setup-steps` before it starts. Copilot honors only steps, permissions,
# runs-on, services, snapshot and timeout-minutes in this job.
name: copilot-setup-steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions: {}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make tools
      - run: git config core.hooksPath .githooks
