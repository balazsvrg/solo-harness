# Monthly report of stale pins in .harness/tools.lock (R22). Report-only: it opens
# or updates one issue. It never changes code. The owner runs
# `scripts/install-tools --update <name|all>` and opens a PR.
name: tools-outdated

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          report=$(scripts/install-tools --outdated)
          if [ -z "$report" ]; then echo 'All pinned tools are current.'; exit 0; fi
          title='Pinned tools are outdated'
          # shellcheck disable=SC2016 # the backticks are Markdown, not command substitution
          body=$(printf 'These tools in `.harness/tools.lock` have a newer release:\n\n%s\n\nRun `scripts/install-tools --update <name|all>` and open a PR.\n' "$report")
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
