# Release PRs (R16). On each push to main, release-please opens or updates one PR
# that bumps version.txt and CHANGELOG.md. The owner merges it; the merge makes the tag.
# A PR made with github.token does not start CI, so the required checks never run.
# Fix: set the secret RELEASE_PLEASE_TOKEN (fine-grained PAT: contents and pull
# requests write), or close and reopen the release PR before you merge it.
name: release-please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # release-please sets the autorelease: labels through the issues API.
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
